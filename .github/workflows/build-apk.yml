name: Gerar APK do Apoio Rosilene
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Gerar APK
        run: |
          npm install -g cordova
          cordova create app com.rtpsicologia.app "R\\T Psicologia"
          cd app
          rm -rf www
          cp -r ../public www
          cordova platform add android
          cordova build android
      
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Apoio-Rosilene-App
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
